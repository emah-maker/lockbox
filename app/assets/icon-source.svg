<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Phone Box app icon: a locked box with a touchscreen countdown timer.
       Checkpoint Claim-Ticket world tokens (bg 1a1a1c, steel c9cbce, locked ef5350). -->
  <rect width="1024" height="1024" fill="#1a1a1c"/>

  <!-- box body -->
  <rect x="256" y="230" width="512" height="650" rx="60" fill="#242426" stroke="#c9cbce" stroke-width="16"/>

  <!-- screen -->
  <rect x="326" y="330" width="372" height="470" rx="30" fill="#0e0e0f" stroke="#000" stroke-width="6"/>

  <!-- countdown timer on the screen: a ring track + a filled wedge showing time elapsing -->
  <circle cx="512" cy="565" r="110" fill="none" stroke="#454649" stroke-width="20"/>
  <path d="M512 565 L512 455 A110 110 0 0 1 596.3 635.7 Z" fill="#ef5350"/>
  <circle cx="512" cy="565" r="10" fill="#0e0e0f"/>

  <!-- padlock, mounted through the lid: shackle + body, unambiguous "locked" cue -->
  <path d="M457 214 v-40 a55 55 0 0 1 110 0 v40" fill="none" stroke="#c9cbce" stroke-width="28" stroke-linecap="round"/>
  <rect x="427" y="170" width="170" height="120" rx="22" fill="#c9cbce"/>
  <circle cx="512" cy="220" r="15" fill="#1a1a1c"/>
  <rect x="503" y="228" width="18" height="28" rx="6" fill="#1a1a1c"/>
</svg>
